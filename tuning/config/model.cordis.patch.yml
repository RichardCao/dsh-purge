# 默认关闭思考，保留可手动选择的思考档位。
- id: llm-pi-ai
  config:
    providers:
      machine-room:
        displayName: Machine-room DeepSeek
        apiKeyEnv: LOCAL_MODEL_API_KEY
        api: openai-responses
        baseURL: http://10.3.16.57:8090/v1
        retryPolicy:
          mode: normal
          maxRetries: 1
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash (machine room)
            contextWindow: 524288
            maxTokens: 8192
            input:
              - text
              - image
            reasoningEfforts:
              'off': none
              low: low
              high: high
              max: max
        reasoning: 'off'
- id: agent-default-model
  config:
    provider: machine-room
    model: deepseek-v4.1-flash
    reasoningEffort: 'off'
